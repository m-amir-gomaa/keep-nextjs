name: Noteweld quality
on:
  push:
    branches: [main, 'feat/**']
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noteweld-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: noteweld_test
          POSTGRES_USER: noteweld_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noteweld_test -d noteweld_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Disposable local service, never a hosted account credential.
      NOTEWELD_TEST_DATABASE_URL: postgresql://noteweld_test:disposable-ci-password@127.0.0.1:5432/noteweld_test
      DATABASE_URL: postgresql://noteweld_test:disposable-ci-password@127.0.0.1:5432/noteweld_test
      AUTH_SECRET: disposable-ci-auth-value-not-for-production
      AUTH_URL: http://localhost:3000
      # Runner Chrome has an Ubuntu-supported sandbox profile.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/isolated.mjs migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:database
      - run: node scripts/isolated.mjs build
      - name: Check sandboxed runner Chrome
        run: google-chrome --version
      - name: Real cookie / PostgreSQL journey and mocked failure states
        run: npm run test:browser
      # Reports may contain recovery form context on failure; keep them out of public artifacts.
